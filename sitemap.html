<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Northgo — Sitemap</title>
  <meta name="description" content="Northgo HTML sitemap with multi-locale content." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #001b3a;
      --navy-deep: #001028;
      --navy-mid: #0a2f5c;
      --cyan: #00d1ff;
      --cyan-soft: #7ae6ff;
      --ink: #0c1a2b;
      --muted: #5a6b7d;
      --line: rgba(0, 27, 58, 0.1);
      --surface: #f4f8fc;
      --white: #ffffff;
      --radius: 14px;
      --shadow: 0 18px 40px rgba(0, 27, 58, 0.08);
      --max: 1120px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: "DM Sans", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 500px at 90% -10%, rgba(0, 209, 255, 0.18), transparent 55%),
        radial-gradient(900px 420px at -10% 20%, rgba(10, 47, 92, 0.12), transparent 50%),
        linear-gradient(180deg, #eaf3fa 0%, var(--surface) 35%, #eef3f8 100%);
      line-height: 1.55;
      min-height: 100vh;
    }

    a { color: inherit; text-decoration: none; }
    .wrap { width: min(100% - 2rem, var(--max)); margin-inline: auto; }

    .hero {
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(120deg, rgba(0, 16, 40, 0.92) 0%, rgba(0, 27, 58, 0.88) 48%, rgba(0, 47, 90, 0.78) 100%),
        url("https://cdn.prod.website-files.com/66fc7398f8b5d731b52bcefb/670eea7be3b8c90fbb9dd350_NG_Planes-Duotone-p-500.webp") center / cover;
      color: var(--white);
      padding: 1.25rem 0 3.25rem;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(-18deg, transparent 0 18px, rgba(0, 209, 255, 0.035) 18px 19px);
      pointer-events: none;
    }

    .topbar {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 2.75rem;
      flex-wrap: wrap;
    }

    .brand {
      font-family: "Outfit", sans-serif;
      font-weight: 800;
      font-size: clamp(1.35rem, 2.5vw, 1.7rem);
      letter-spacing: 0.02em;
      display: inline-flex;
      align-items: center;
      gap: 0.15em;
    }

    .brand span { color: var(--cyan); }

    .brand-mark {
      width: 0.72em;
      height: 0.72em;
      border: 2px solid var(--cyan);
      border-radius: 50%;
      display: inline-grid;
      place-items: center;
      margin-left: 0.05em;
    }

    .brand-mark i {
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 0.18em 0 0.18em 0.3em;
      border-color: transparent transparent transparent var(--cyan);
      margin-left: 0.06em;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      flex-wrap: wrap;
    }

    .official {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(0, 209, 255, 0.35);
      padding: 0.45rem 0.85rem;
      border-radius: 999px;
      white-space: nowrap;
    }

    .official a { color: var(--cyan-soft); font-weight: 600; }

    .lang-switch {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      padding: 0.25rem;
    }

    .lang-switch button {
      appearance: none;
      border: 0;
      background: transparent;
      color: rgba(255, 255, 255, 0.78);
      font: inherit;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 0.4rem 0.7rem;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .lang-switch button[aria-pressed="true"] {
      background: var(--cyan);
      color: var(--navy-deep);
    }

    .lang-switch button:focus-visible {
      outline: 2px solid var(--cyan-soft);
      outline-offset: 2px;
    }

    .hero-copy {
      position: relative;
      z-index: 1;
      max-width: 42rem;
      animation: rise 0.7s ease both;
    }

    .hero-copy h1 {
      font-family: "Outfit", sans-serif;
      font-weight: 700;
      font-size: clamp(2rem, 5.5vw, 3.35rem);
      line-height: 1.1;
      margin: 0 0 0.85rem;
      letter-spacing: -0.02em;
    }

    .hero-copy h1 em { font-style: normal; color: var(--cyan); }

    .hero-copy p {
      margin: 0 0 1.4rem;
      color: rgba(255, 255, 255, 0.82);
      font-size: clamp(0.98rem, 2vw, 1.08rem);
      max-width: 36rem;
    }

    .meta-row { display: flex; flex-wrap: wrap; gap: 0.65rem; }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 0.8rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      font-size: 0.84rem;
      color: rgba(255, 255, 255, 0.9);
    }

    .chip strong { color: var(--cyan); font-weight: 700; }

    .jump {
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(12px);
      background: rgba(244, 248, 252, 0.85);
      border-bottom: 1px solid var(--line);
    }

    .jump-inner {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding: 0.75rem 0;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }

    .jump a {
      flex: 0 0 auto;
      padding: 0.45rem 0.9rem;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--navy-mid);
      background: var(--white);
      border: 1px solid var(--line);
      transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.2s;
    }

    .jump a:hover,
    .jump a:focus-visible {
      background: var(--navy);
      color: var(--white);
      border-color: var(--navy);
      outline: none;
      transform: translateY(-1px);
    }

    main { padding: 2rem 0 3.5rem; }

    section {
      margin-bottom: 2rem;
      animation: rise 0.6s ease both;
    }

    section:nth-of-type(2) { animation-delay: 0.05s; }
    section:nth-of-type(3) { animation-delay: 0.1s; }
    section:nth-of-type(4) { animation-delay: 0.15s; }
    section:nth-of-type(5) { animation-delay: 0.2s; }
    section:nth-of-type(6) { animation-delay: 0.25s; }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .section-head h2 {
      font-family: "Outfit", sans-serif;
      font-size: clamp(1.35rem, 3vw, 1.7rem);
      margin: 0;
      letter-spacing: -0.02em;
      color: var(--navy);
    }

    .section-head p {
      margin: 0.25rem 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .count {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--navy-mid);
      background: rgba(0, 209, 255, 0.15);
      border: 1px solid rgba(0, 209, 255, 0.28);
      padding: 0.3rem 0.65rem;
      border-radius: 999px;
    }

    .grid {
      display: grid;
      gap: 0.85rem;
      grid-template-columns: 1fr;
    }

    @media (min-width: 640px) {
      .grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
      .grid.cols-3 { grid-template-columns: repeat(2, 1fr); }
    }

    @media (min-width: 900px) {
      .grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
      .grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
    }

    .card {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1.1rem 1.15rem 1.15rem;
      box-shadow: var(--shadow);
      transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      min-height: 100%;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(0, 209, 255, 0.45);
      box-shadow: 0 22px 44px rgba(0, 27, 58, 0.12);
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .card h3 {
      font-family: "Outfit", sans-serif;
      font-size: 1.05rem;
      margin: 0;
      color: var(--navy);
      letter-spacing: -0.01em;
    }

    .path {
      font-family: ui-monospace, "Cascadia Code", "SF Mono", Menlo, monospace;
      font-size: 0.78rem;
      color: var(--muted);
      word-break: break-all;
      background: var(--surface);
      padding: 0.35rem 0.55rem;
      border-radius: 8px;
      border: 1px solid var(--line);
    }

    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
      flex: 1;
    }

    .badge {
      flex: 0 0 auto;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 0.28rem 0.5rem;
      border-radius: 6px;
      background: rgba(0, 27, 58, 0.06);
      color: var(--navy-mid);
    }

    .badge.primary { background: rgba(0, 209, 255, 0.16); color: #007a96; }
    .badge.anchor { background: rgba(10, 47, 92, 0.08); color: var(--navy-mid); }
    .badge.warn { background: #fff1e8; color: #b34d12; }

    .card-link {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      margin-top: 0.25rem;
      font-weight: 700;
      font-size: 0.9rem;
      color: #0086a3;
    }

    .card-link::after {
      content: "→";
      transition: transform 0.2s;
    }

    .card:hover .card-link::after,
    .tree-parent:hover .card-link::after {
      transform: translateX(3px);
    }

    .tree {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .tree-item { border-bottom: 1px solid var(--line); }
    .tree-item:last-child { border-bottom: 0; }

    .tree-parent {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.15rem;
      flex-wrap: wrap;
      background: linear-gradient(90deg, rgba(0, 209, 255, 0.08), transparent 55%);
    }

    .tree-parent h3 {
      margin: 0;
      font-family: "Outfit", sans-serif;
      font-size: 1.05rem;
      color: var(--navy);
    }

    .tree-parent .path { margin-top: 0.35rem; }

    .tree-children {
      display: grid;
      gap: 0;
      padding: 0.25rem 0 0.55rem;
      background: #fbfdff;
    }

    .tree-child {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.35rem;
      padding: 0.75rem 1.15rem 0.75rem 2rem;
      position: relative;
      border-top: 1px dashed rgba(0, 27, 58, 0.08);
      transition: background 0.2s;
    }

    .tree-child::before {
      content: "";
      position: absolute;
      left: 1.15rem;
      top: 1.15rem;
      width: 0.45rem;
      height: 0.45rem;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 0 4px rgba(0, 209, 255, 0.15);
    }

    .tree-child:hover { background: rgba(0, 209, 255, 0.06); }
    .tree-child a { font-weight: 700; color: var(--navy); }
    .tree-child span { font-size: 0.88rem; color: var(--muted); }

    @media (min-width: 720px) {
      .tree-child {
        grid-template-columns: minmax(10rem, 0.4fr) 1fr;
        align-items: baseline;
        padding-left: 2.25rem;
      }
      .tree-child::before { left: 1.35rem; }
    }

    .office-list {
      display: grid;
      gap: 0.75rem;
      grid-template-columns: 1fr;
    }

    @media (min-width: 640px) {
      .office-list { grid-template-columns: repeat(2, 1fr); }
    }

    @media (min-width: 960px) {
      .office-list { grid-template-columns: repeat(3, 1fr); }
    }

    .office {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1rem 1.1rem;
    }

    .office h3 {
      margin: 0 0 0.35rem;
      font-family: "Outfit", sans-serif;
      font-size: 0.98rem;
      color: var(--navy);
    }

    .office p {
      margin: 0;
      font-size: 0.86rem;
      color: var(--muted);
    }

    .note {
      margin-top: 0.85rem;
      padding: 0.85rem 1rem;
      border-radius: 12px;
      background: rgba(0, 27, 58, 0.04);
      border: 1px dashed rgba(0, 27, 58, 0.18);
      color: var(--muted);
      font-size: 0.9rem;
    }

    footer {
      border-top: 1px solid var(--line);
      padding: 1.5rem 0 2.25rem;
      color: var(--muted);
      font-size: 0.88rem;
    }

    footer .wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      justify-content: space-between;
      align-items: center;
    }

    footer a { color: var(--navy-mid); font-weight: 600; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

    function pathFor(locale, path) {
      const prefix = LOCALES[locale].prefix;
      if (!path || path === "/") return prefix || "/";
      return `${prefix}${path}`;
    }

    function urlFor(locale, path) {
      const p = pathFor(locale, path);
      return `${BASE}${p === "/" ? "/" : p}`;
    }

    function card(html) {
      return `<article class="card">${html}</article>`;
    }

      const loc = LOCALES[locale];
      document.documentElement.lang = loc.htmlLang;

        `<button type="button" data-locale="${l.code}" aria-pressed="${l.code === locale}">${l.label}</button>`
      ).join("");

      document.getElementById("sourceLabel").innerHTML =
        `${t.source} <a href="${urlFor(locale, "/")}" target="_blank" rel="noopener">www.northgo.com${loc.prefix || ""}</a>`;

      document.getElementById("heroTitle").innerHTML = t.heroTitle;
      document.getElementById("heroDesc").textContent = t.heroDesc;
      document.getElementById("metaRow").innerHTML = t.chips.map((c, i) => {
        const strongMatch = c.match(/^(\d+\+?|\d{4}-\d{2}-\d{2})(.*)$/);
        if (i < 3 && strongMatch) {
          return `<span class="chip"><strong>${strongMatch[1]}</strong>${strongMatch[2]}</span>`;
        }
        return `<span class="chip">${c}</span>`;
      }).join("");

      document.getElementById("jumpNav").innerHTML = Object.entries(t.jump).map(([id, label]) =>

          <div class="section-head">
            <div>
              <h2>${t.sections.locations.title}</h2>
              <p>${t.sections.locations.desc}</p>
            </div>
            <span class="count">${t.sections.locations.count}</span>
          </div>
          <div class="office-list">
            ${t.offices.map(([name, detail]) => `
              <article class="office"><h3>${name}</h3><p>${detail}</p></article>
            `).join("")}
          </div>
          <p class="note">${p.locationsNotePrefix} <a href="${urlFor(locale, "/contact")}" target="_blank" rel="noopener">${pathFor(locale, "/contact")}</a>. <a href="locations.html?lang=${locale}">${p.mapLink}</a></p>
        </section>

        <section id="legal">
          <div class="section-head">
            <div>
              <h2>${t.sections.legal.title}</h2>
              <p>${t.sections.legal.desc}</p>
            </div>
            <span class="count">${t.sections.legal.count}</span>
          </div>
          <div class="grid cols-2 cols-4">${legalCards}</div>
        </section>

        <section id="locales">
          <div class="section-head">
            <div>
              <h2>${t.sections.locales.title}</h2>
              <p>${t.sections.locales.desc}</p>
            </div>
            <span class="count">${t.sections.locales.count}</span>
          </div>
          <div class="grid cols-2 cols-4">
            ${t.localeCards.map((c) => card(`
              <div class="card-top">
                <h3>${c.title}</h3>
                <span class="badge ${c.key === "en" ? "primary" : ""}">${c.badge}</span>
              </div>
              <div class="path">${c.path}</div>
              <a class="card-link" href="${BASE}${c.path === "/" ? "/" : c.path}" target="_blank" rel="noopener">${t.open}</a>
            `)).join("")}
          </div>
          <div class="tree" style="margin-top: 1rem;">
            <div class="tree-item">
              <div class="tree-parent">
                <div>
                  <h3>${p.localePathsTitle}${localeExamplePrefix ? `（${localeExamplePrefix}）` : ""}</h3>
                  <div class="path">/{locale}/…</div>
                </div>
              </div>
              <div class="tree-children">
                ${examplePaths.map(([suffix, label]) => {
                  const full = pathFor(locale, suffix || "/");
                  return `
                    <div class="tree-child">
                      <a href="${urlFor(locale, suffix || "/")}" target="_blank" rel="noopener">${full}</a>
                      <span>${label}</span>
                    </div>`;
                }).join("")}
              </div>
            </div>
          </div>
          <p class="note">${p.localeNote}</p>
        </section>
      `;

      document.getElementById("footerRow").innerHTML = `
        <p>${t.footerLeft} · <a href="sitemap-tree.html?lang=${locale}">${t.treeView}</a></p>
        <p>${t.footerRight}</p>
      `;

      document.querySelectorAll("#langSwitch button").forEach((btn) => {
        btn.addEventListener("click", () => {
          const next = btn.dataset.locale;
          localStorage.setItem("northgo-sitemap-lang", next);
          const url = new URL(location.href);
          url.searchParams.set("lang", next);
          history.replaceState(null, "", url);
          render(next);
        });
      });
    }

    const params = new URLSearchParams(location.search);
    const initial = params.get("lang") || localStorage.getItem("northgo-sitemap-lang") || "zh-tw";
    render(I18N[initial] ? initial : "zh-tw");
  </script>
</body>
</html>
