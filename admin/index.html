<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>客戶詢問｜Northgo 後台管理</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <div class="admin-shell">
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand-lockup" href="/admin/">
          <span class="brand-name">Northgo</span>
          <span class="brand-sub">後台管理</span>
          <span class="brand-ver" id="admin-version">v—</span>
        </a>
        <div class="topbar-user">
          <div class="user-chip">
            <div class="avatar" id="admin-avatar">NG</div>
            <div class="user-chip-meta">
              <strong id="admin-user"></strong>
              <span id="admin-handle"></span>
            </div>
            <span class="badge role-admin" id="admin-role"></span>
          </div>
          <a class="btn ghost" id="my-account-btn" href="/admin/users.html" hidden>我的帳號</a>
          <button class="btn ghost" type="button" id="logout-btn">登出</button>
        </div>
      </div>
    </header>

    <nav class="tab-nav" aria-label="後台選單">
      <div class="tab-nav-inner">
        <a class="is-active" href="/admin/">客戶詢問</a>
        <a href="/admin/content.html">網站內容</a>
        <a href="/admin/media.html">媒體</a>
        <a href="/admin/pages.html">頁面</a>
        <a id="nav-users" href="/admin/users.html" hidden>使用者</a>
      </div>
    </nav>

    <main class="page">
      <section class="panel">
        <div class="toolbar">
          <label class="filter-field search">
            <span>搜尋</span>
            <input id="search-input" type="search" placeholder="姓名、公司、編號、路線…" autocomplete="off">
          </label>
          <label class="filter-field narrow">
            <span>狀態</span>
            <select id="status-filter">
              <option value="all">全部</option>
              <option value="new">新詢價</option>
              <option value="in_progress">處理中</option>
              <option value="quoted">已報價</option>
              <option value="closed">已結案</option>
              <option value="spam">垃圾</option>
            </select>
          </label>
          <label class="filter-field narrow">
            <span>辦公室</span>
            <select id="office-filter">
              <option value="">全部</option>
            </select>
          </label>
          <label class="filter-field narrow">
            <span>每頁</span>
            <select id="page-size">
              <option value="10">10</option>
              <option value="20" selected>20</option>
              <option value="50">50</option>
            </select>
          </label>
          <div class="toolbar-actions">
            <div class="settings-wrap">
              <button class="btn ghost" type="button" id="settings-btn" title="設定" aria-expanded="false" aria-controls="settings-menu"></button>
              <div class="popover" id="settings-menu" hidden role="menu">
                <button type="button" data-settings="reset">重設篩選</button>
                <button type="button" data-settings="site">開啟前台網站</button>
              </div>
            </div>
            <button class="btn ghost" type="button" id="refresh-btn" title="重新載入"></button>
            <button class="btn primary" type="button" id="create-btn"></button>
          </div>
        </div>

        <div class="table-wrap">
          <table class="data-table" aria-label="詢價列表">
            <thead>
              <tr>
                <th>編號</th>
                <th>客戶</th>
                <th>服務</th>
                <th>辦公室</th>
                <th>狀態</th>
                <th>建立時間</th>
                <th class="actions-col">操作</th>
              </tr>
            </thead>
            <tbody id="inquiry-table-body"></tbody>
          </table>
        </div>

        <div class="pager">
          <div class="pager-meta" id="pager-meta">共 0 筆</div>
          <div class="pager-controls">
            <button class="btn ghost" type="button" id="prev-page" disabled>上頁</button>
            <button class="btn ghost" type="button" id="next-page" disabled>下頁</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="modal-root" id="modal-root" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-panel wide" id="modal-panel" role="dialog" aria-modal="true"></div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <script src="/admin/version.js"></script>
  <script src="/admin/shared.js"></script>
  <script src="/admin/admin.js"></script>
</body>
</html>
