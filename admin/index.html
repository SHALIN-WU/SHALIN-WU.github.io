<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>詢價管理｜Northgo</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <div class="admin-app">
    <aside class="sidebar">
      <a class="sidebar-brand" href="/admin/">
        <img src="/assets/logo-on-dark.svg" alt="Northgo" width="168" height="33">
      </a>
      <nav class="side-nav" aria-label="後台選單">
        <a class="is-active" href="/admin/">詢價管理</a>
        <a id="nav-users" href="/admin/users.html" hidden>使用者管理</a>
        <a href="/" target="_blank" rel="noopener">前台網站</a>
      </nav>
      <div class="sidebar-foot">
        <div class="avatar" id="admin-avatar">NG</div>
        <div>
          <strong id="admin-user"></strong>
          <span id="admin-role"></span>
        </div>
      </div>
      <p class="sidebar-version" id="admin-version">v—</p>
    </aside>

    <div class="workspace">
      <header class="hero-band">
        <img src="/assets/northgo-hero.jpg" alt="" width="1024" height="576">
        <div class="hero-band-copy">
          <p class="eyebrow">Enquiry Desk</p>
          <h1>詢價管理</h1>
          <p>追蹤前台送來的貨況詢價，更新狀態並留下內部備註。</p>
        </div>
      </header>

      <div class="top-actions-bar">
        <button class="btn" type="button" id="create-btn">新增詢價</button>
        <button class="btn ghost" type="button" id="refresh-btn">重新整理</button>
        <button class="btn ghost" type="button" id="logout-btn">登出</button>
      </div>

      <main class="main">
        <section class="stats" id="stats" aria-label="狀態統計"></section>
        <section class="panel">
          <div class="toolbar">
            <input id="search-input" type="search" placeholder="搜尋姓名、公司、編號、路線…">
            <select id="office-filter">
              <option value="">全部辦公室</option>
            </select>
          </div>
          <div class="layout">
            <div class="list" id="inquiry-list" aria-label="詢價列表"></div>
            <div class="detail" id="inquiry-detail">
              <p class="detail-empty" id="detail-empty">選擇一筆詢價以檢視、編輯，或點「新增詢價」建立資料。</p>
              <div id="detail-body" hidden></div>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <script src="/admin/version.js"></script>
  <script src="/admin/shared.js"></script>
  <script src="/admin/admin.js"></script>
</body>
</html>
